<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B3A6B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Customer Feedback and Complaint Management System for Inland Revenue Office (IRO) Koteshwor, Nepal | आन्तरिक राजस्व कार्यालय, कोटेश्वर" />
    <meta name="keywords" content="IRO Koteshwor, Tax Office Nepal, Feedback System, कर कार्यालय, कोटेश्वर" />
    <title>IRO Koteshwor | आन्तरिक राजस्व कार्यालय, कोटेश्वर</title>
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    
    <!-- Optimized font loading -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%231B3A6B'/%3E%3Ctext x='50' y='65' font-size='40' text-anchor='middle' fill='white' font-family='Arial'%3Eने%3C/text%3E%3C/svg%3E" />
    
    <style>
      /* Critical CSS - inline for performance */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { 
        width: 100%; 
        min-height: 100vh; 
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body { 
        font-family: 'Inter', 'Mukta', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      
      /* Loading spinner */
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 9999;
      }
      .app-loader::after {
        content: '';
        width: 48px;
        height: 48px;
        border: 4px solid #e2e8f0;
        border-top-color: #1B3A6B;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Safe area support */
      @supports (padding: max(0px)) {
        .safe-top { padding-top: max(0.5rem, env(safe-area-inset-top)); }
        .safe-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
